name: K Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1.6.0
        with:
          ndk-version: r21e
          local-cache: true
          link-to-sdk: true

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "11"

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2.0.2
        with:
          haxe-version: 4.2.5

      # Guarda somente os objetos pesados da compilação.
      # A pasta .haxelib não é guardada enquanto o android-manager está sendo ajustado,
      # evitando reutilizar uma cópia antiga do fork.
      - name: Restore build cache
        uses: actions/cache@v5
        with:
          path: |
            export/release/android/haxe
            export/release/android/obj
          key: kade-android-v3-${{ runner.os }}-${{ hashFiles('hmm.json', 'Project.xml') }}
          restore-keys: |
            kade-android-v3-${{ runner.os }}-

      - name: Install libraries
        shell: bash
        run: |
          set -euo pipefail

          haxelib install hmm --quiet
          haxelib run hmm install

          echo "Dependências instaladas:"
          haxelib list

      - name: Configure Android
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail

          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_HOME"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          java -version
          haxe -version

      # Gera o projeto Android e compila somente o Java primeiro.
      # Assim erros do android-manager aparecem antes da compilação C++ demorada.
      - name: Android Java preflight
        shell: bash
        run: |
          set -euo pipefail

          haxelib run lime update android -final

          cd export/release/android/bin
          chmod +x gradlew

          ./gradlew :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          haxelib run lime build android -final

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Kadesh-Android
          path: export/release/android/bin/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Kadesh-Build-Reports
          path: |
            export/release/android/bin/app/build/reports/**
            export/release/android/bin/**/*.log
          if-no-files-found: ignore
          retention-days: 7
