name: K Build

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  Build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Descobre o commit atual do fork do android-manager.
      # Assim, quando você atualizar o fork, o cache de dependências muda sozinho.
      - name: Resolve android-manager revision
        id: android_manager
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import subprocess

          with open("hmm.json", "r", encoding="utf-8") as file:
              data = json.load(file)

          dependency = next(
              item
              for item in data["dependencies"]
              if item.get("name") == "android-manager"
          )

          url = dependency["url"]
          ref = dependency.get("ref", "main")

          candidates = [
              f"refs/heads/{ref}",
              f"refs/tags/{ref}",
              ref
          ]

          revision = ""

          for candidate in candidates:
              result = subprocess.run(
                  ["git", "ls-remote", url, candidate],
                  text=True,
                  capture_output=True,
                  check=False
              )

              if result.returncode == 0 and result.stdout.strip():
                  revision = result.stdout.split()[0]
                  break

          if not revision:
              raise RuntimeError(
                  f"Não foi possível descobrir a revisão de {url} ({ref})."
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"revision={revision}\n")

          print(f"android-manager revision: {revision}")
          PY

      - name: Setup Android NDK
        id: setup_ndk
        uses: nttld/setup-ndk@v1.6.0
        with:
          ndk-version: r21e
          local-cache: true
          link-to-sdk: true

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "11"

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2.0.2
        with:
          haxe-version: 4.2.5

      # Cache 1: bibliotecas instaladas pelo HMM.
      # Só é invalidado quando hmm.json ou o fork do android-manager muda.
      - name: Restore Haxelib cache
        id: haxelib_cache
        uses: actions/cache/restore@v5
        with:
          path: .haxelib
          key: >-
            kade-haxelib-${{ runner.os }}-
            ${{ hashFiles('hmm.json') }}-
            ${{ steps.android_manager.outputs.revision }}

      - name: Install libraries
        shell: bash
        run: |
          set -euo pipefail

          haxelib install hmm --quiet
          haxelib run hmm install

          echo "Dependências instaladas:"
          haxelib list

      # Salva as bibliotecas logo após instalar.
      # Desse modo elas ficam em cache mesmo se a compilação falhar depois.
      - name: Save Haxelib cache
        if: steps.haxelib_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .haxelib
          key: >-
            kade-haxelib-${{ runner.os }}-
            ${{ hashFiles('hmm.json') }}-
            ${{ steps.android_manager.outputs.revision }}

      # Cache 2: objetos C++, arquivos Haxe gerados e cache do Gradle.
      # O run_id deixa a chave nova, enquanto restore-keys recupera o build
      # incremental mais recente compatível.
      - name: Restore build cache
        id: build_cache
        uses: actions/cache/restore@v5
        with:
          path: |
            export/release/android/haxe
            export/release/android/obj
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: >-
            kade-build-${{ runner.os }}-
            ${{ hashFiles('hmm.json', 'Project.xml') }}-
            ${{ steps.android_manager.outputs.revision }}-
            ${{ github.run_id }}
          restore-keys: |
            kade-build-${{ runner.os }}-${{ hashFiles('hmm.json', 'Project.xml') }}-${{ steps.android_manager.outputs.revision }}-

      - name: Configure Android
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail

          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_HOME"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          java -version
          haxe -version

      # Verifica o Java antes da compilação C++ demorada.
      - name: Android Java preflight
        shell: bash
        run: |
          set -euo pipefail

          haxelib run lime update android -final

          cd export/release/android/bin
          chmod +x gradlew

          ./gradlew :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          haxelib run lime build android -final

      # Salva o resultado incremental somente depois de uma build completa.
      - name: Save build cache
        uses: actions/cache/save@v5
        with:
          path: |
            export/release/android/haxe
            export/release/android/obj
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: >-
            kade-build-${{ runner.os }}-
            ${{ hashFiles('hmm.json', 'Project.xml') }}-
            ${{ steps.android_manager.outputs.revision }}-
            ${{ github.run_id }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Kadesh-Android
          path: export/release/android/bin/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Kadesh-Build-Reports
          path: |
            export/release/android/bin/app/build/reports/**
            export/release/android/bin/**/*.log
          if-no-files-found: ignore
          retention-days: 7
